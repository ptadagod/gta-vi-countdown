<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0612" />
    <meta name="description" content="Real-world GPS navigation drawn as a game-style minimap." />
    <title>GPS Minimap</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <form class="route-form" autocomplete="off" novalidate>
        <label class="field from">
          <span class="dot dot-from" aria-hidden="true"></span>
          <input id="from" type="text" placeholder="My location" aria-label="Start" spellcheck="false" />
        </label>
        <label class="field to">
          <span class="dot dot-to" aria-hidden="true"></span>
          <input id="to" type="text" placeholder="Set waypoint" aria-label="Destination" spellcheck="false" />
        </label>
        <ul class="suggestions" role="listbox" hidden></ul>
      </form>

      <div class="frame">
        <div class="minimap">
          <div id="map"></div>
          <div class="haze" aria-hidden="true"></div>
          <div class="hud" aria-live="polite">
            <div class="distance" hidden></div>
            <div class="north" aria-hidden="true">N</div>
            <div class="waypoint" hidden aria-hidden="true"></div>
            <div class="player" hidden aria-hidden="true">
              <svg viewBox="0 0 32 32" width="32" height="32">
                <circle cx="16" cy="16" r="14" fill="#121212" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" />
                <path d="M16 6.5 L23.2 23.5 L16 19.6 L8.8 23.5 Z" fill="#fff" stroke="#fff" stroke-width="0.6" stroke-linejoin="round" />
              </svg>
            </div>
          </div>
          <div class="toast" hidden></div>
        </div>
      </div>

      <p class="hint">
        <span><kbd>Space</kbd> drive</span>
        <span><kbd>Tab</kbd> alternative route</span>
        <span>click the map to drop a waypoint</span>
        <span class="sim-speed" hidden></span>
      </p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
