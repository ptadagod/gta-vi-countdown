<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>HUD Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <canvas class="lights" aria-hidden="true"></canvas>
    <div class="tint" aria-hidden="true"></div>

    <div class="stats">
      <div class="bar health" data-part="health">
        <span class="badge"></span>
        <span class="track"><span class="fill"></span><span class="marker"></span></span>
      </div>
      <div class="bar stamina" data-part="stamina">
        <span class="badge"></span>
        <span class="track"><span class="fill"></span></span>
      </div>
      <div class="bar special" data-part="special">
        <span class="badge"></span>
        <span class="track"><span class="fill"></span></span>
      </div>
    </div>

    <div class="right">
      <div class="wanted" data-part="wanted">
        <div class="stars"></div>
        <div class="clues"></div>
      </div>
      <div class="weapon" data-part="weapon">
        <div class="ammo"><span class="clip"></span><span class="reserve"></span></div>
        <div class="gun"></div>
      </div>
      <div class="money" data-part="money">
        <div class="line bank"><span class="amount"></span><span class="ring"></span></div>
        <div class="line cash"><span class="amount"></span><span class="ring"></span></div>
      </div>
    </div>

    <div class="corner">
      <div class="directions" data-part="directions"></div>
      <div class="minimap" data-part="minimap" hidden>
        <div class="map"></div>
        <div class="haze" aria-hidden="true"></div>
        <div class="distance" hidden></div>
        <div class="north" aria-hidden="true">N</div>
        <div class="waypoint" hidden aria-hidden="true"></div>
        <div class="player" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="14" fill="#121212" stroke="rgba(255,255,255,0.92)" stroke-width="1.6" />
            <path d="M16 6.5 L23.2 23.5 L16 19.6 L8.8 23.5 Z" fill="#fff" stroke="#fff" stroke-width="0.6" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Weapon wheel: opened from the dock. -->
    <div class="wheel" data-part="wheel" hidden>
      <div class="wheel-tint"></div>
      <div class="wheel-ring">
        <div class="wheel-tabs"><span data-tab="weapons">Weapons</span><span data-tab="items">Items</span></div>
        <div class="wheel-label"><b></b><span></span></div>
        <div class="slots"></div>
      </div>
      <div class="consumables"></div>
    </div>

    <script type="module" src="./overlay.js"></script>
  </body>
</html>
