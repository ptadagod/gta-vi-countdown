# Cloudflare Worker that keeps each streamer's overlay and control panel in sync.
# Deploy with:  npx wrangler deploy   (from this folder, after `npx wrangler login`)
name = "hud-overlay-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Objects on the free plan must use SQLite storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
